<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/css/yla.css">
<style>
body{background:var(--charcoal);color:var(--paper)}
.topbar .brand,.topbar .dots{color:var(--paper)}
.vrail{color:var(--paper)}
.page{position:relative;padding:clamp(86px,11vh,128px) var(--rail) clamp(60px,9vh,110px) clamp(40px,5vw,96px)}

.equipo-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  border-bottom:1px solid var(--line-on-dark);padding-bottom:16px;margin-bottom:clamp(40px,6vh,72px)}
.equipo-head .eyebrow2{font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
.equipo-head .count{font-size:12px;letter-spacing:.1em;color:rgba(243,242,234,.5);font-variant-numeric:tabular-nums}

.roster{display:flex;flex-direction:column}
.member{
  display:grid;grid-template-columns:0.92fr 1.32fr 0.92fr;
  gap:clamp(30px,3.6vw,68px);align-items:start;
  padding:clamp(40px,6vh,76px) 0;
  border-top:1px solid var(--line-on-dark);
}
.member:first-child{border-top:none;padding-top:0}
.member[data-side="right"]{grid-template-columns:1.32fr 0.92fr 0.92fr}
.m-photo{order:1}
.m-content{order:2}
.m-cred{order:3}
.member[data-side="right"] .m-content{order:1}
.member[data-side="right"] .m-cred{order:2}
.member[data-side="right"] .m-photo{order:3}

.m-photo{position:relative;aspect-ratio:3/3.7;overflow:hidden;align-self:stretch}
.m-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:grayscale(1) contrast(1.03)}
.m-num{position:absolute;top:14px;left:16px;font-size:12px;letter-spacing:.18em;color:var(--paper);
  mix-blend-mode:difference;font-weight:500}

.m-name-row{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.m-name-row .arw{width:26px;flex:0 0 auto}
.m-name{font-weight:500;font-size:clamp(26px,2.6vw,40px);letter-spacing:-.012em;line-height:1.04}
.m-role{font-family:var(--f-serif);font-style:italic;font-size:clamp(16px,1.35vw,21px);color:rgba(243,242,234,.78);margin:0 0 clamp(22px,2.8vh,32px) 40px}
.m-bio{margin-left:40px;max-width:52ch}
.m-bio p{font-size:clamp(13px,1.02vw,15px);line-height:1.64;color:rgba(243,242,234,.82);margin-bottom:13px;text-wrap:pretty}

.m-cred{padding-top:2px;border-left:1px solid var(--line-on-dark);padding-left:clamp(22px,2vw,40px)}
.cred-group{margin-bottom:22px}
.cred-group h4{font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--paper);margin-bottom:12px}
.cred-group ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.cred-group li{display:flex;gap:11px;font-size:12px;line-height:1.42;color:rgba(243,242,234,.72)}
.cred-group li .b{flex:0 0 auto;margin-top:.5em;width:13px;height:1px;background:rgba(243,242,234,.55);position:relative}
.cred-group li .b::after{content:"";position:absolute;right:0;top:50%;width:5px;height:5px;border-top:1px solid rgba(243,242,234,.55);border-right:1px solid rgba(243,242,234,.55);transform:translateY(-50%) rotate(45deg)}
.cred-foot{margin-top:6px;padding-top:18px;border-top:1px solid var(--line-on-dark);font-size:12px;letter-spacing:.04em;color:rgba(243,242,234,.72);line-height:1.95}
.cred-foot b{font-weight:500;letter-spacing:.16em;text-transform:uppercase;font-size:10.5px}
.cred-foot a{color:var(--sage)}

/* entrance */
.member{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.member.in{opacity:1;transform:none}
.member:nth-child(2){transition-delay:.08s}
.member:nth-child(3){transition-delay:.16s}
@media (prefers-reduced-motion:reduce){.member{opacity:1;transform:none}}

@media (max-width:1040px){
  .member,.member[data-side="right"]{grid-template-columns:0.9fr 1.1fr;gap:30px}
  .m-cred{grid-column:1/-1;border-left:none;padding-left:0;border-top:1px solid var(--line-on-dark);padding-top:26px;
    display:grid;grid-template-columns:1fr 1fr;gap:24px 40px}
  .cred-foot{grid-column:1/-1}
  .member[data-side="right"] .m-photo{order:2}
  .member[data-side="right"] .m-content{order:1}
  .member[data-side="right"] .m-cred{order:3}
}
@media (max-width:680px){
  .member,.member[data-side="right"]{grid-template-columns:1fr;gap:22px}
  .m-cred{grid-template-columns:1fr}
  .m-bio,.m-role{margin-left:0}
  .member[data-side="right"] .m-photo,.m-photo{order:1}
  .member[data-side="right"] .m-content,.m-content{order:2}
  .member[data-side="right"] .m-cred,.m-cred{order:3}
  .m-photo{aspect-ratio:3/3.4}
}
</style>
</head>

<script>
(function(){
  var roster=document.getElementById('roster');
  function L(){return document.documentElement.getAttribute('data-lang')==='en'?'en':'es';}

  function credHTML(m,lang){
    var h='';
    m['cred_'+lang].forEach(function(g){
      h+='<div class="cred-group"><h4>'+g.h+'</h4><ul>';
      g.items.forEach(function(it){h+='<li><span class="b"></span><span>'+it+'</span></li>';});
      h+='</ul></div>';
    });
    var iL=lang==='en'?'Languages':'Idiomas', cL=lang==='en'?'Contact':'Contacto';
    h+='<div class="cred-foot"><b>'+iL+'</b> / '+m['lang_'+lang]+'<br><b>'+cL+'</b> / <a href="mailto:'+m.email+'">'+m.email+'</a></div>';
    return h;
  }

  function render(){
    var lang=L();
    roster.innerHTML='';
    MEMBERS.forEach(function(m,i){
      var sec=document.createElement('section');
      sec.className='member';
      sec.setAttribute('data-side', i%2===1?'right':'left');
      var num=String(i+1).padStart(2,'0');
      sec.innerHTML=
        '<div class="m-photo"><span class="m-num">'+num+'</span><img src="'+m.photo+'" alt="'+m.name+'"></div>'+
        '<div class="m-content">'+
          '<div class="m-name-row"><span class="arw"></span><h2 class="m-name">'+m.name+'</h2></div>'+
          '<p class="m-role">'+m['role_'+lang]+'</p>'+
          '<div class="m-bio">'+m['bio_'+lang].map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>'+
        '</div>'+
        '<aside class="m-cred">'+credHTML(m,lang)+'</aside>';
      roster.appendChild(sec);
    });
    document.getElementById('count').textContent=(lang==='en'?'':'')+String(MEMBERS.length).padStart(2,'0');
    observe();
  }

  function observe(){
    var secs=roster.querySelectorAll('.member');
    // reveal reliably on load; never leave content hidden
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      secs.forEach(function(s){s.classList.add('in');});
    });});
  }

  window.addEventListener('yla:lang',render);
  render();
})();
</script>
