<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#222}</style></head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';
window.__renderPage = async (n, scale)=>{
  const pdf = await pdfjs.getDocument('diseno_web_yla.pdf').promise;
  window.__total = pdf.numPages;
  const page = await pdf.getPage(n);
  const vp = page.getViewport({scale:scale||1.0});
  const c = document.getElementById('c');
  c.width=vp.width; c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
  window.__url = c.toDataURL('image/jpeg',0.72);
  window.__done = n;
  return 'ok';
};
window.__ready = true;
</script>
</body></html>
