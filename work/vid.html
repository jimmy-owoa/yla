<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}video{width:100%}</style></head>
<body>
<video id="v" src="../uploads/large-thumbnail20250219-1770689-64jwi.mp4" muted playsinline></video>
<script>
const v=document.getElementById('v');
v.addEventListener('loadedmetadata',()=>{window.__dur=v.duration;window.__meta=true;});
window.seekTo=(t)=>new Promise(r=>{v.currentTime=t;v.addEventListener('seeked',function h(){v.removeEventListener('seeked',h);r(true);});});
</script>
</body></html>
