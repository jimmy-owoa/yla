<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipo — YLA</title>
<link rel="stylesheet" href="assets/css/yla.css">
<style>
/* ============ EQUIPO — angled collage (faithful to print) ============ */
:root{--cut:78px}            /* diagonal drop across the content width */
body{background:var(--night);color:var(--paper)}
.topbar .brand,.topbar .dots{color:var(--ink)}   /* dark logo on sage masthead */
.vrail{color:var(--paper)}

.page{position:relative;padding:0 var(--rail) 0 0}
.hpad{padding-left:clamp(28px,5vw,88px);padding-right:clamp(28px,5vw,88px)}

/* ---------- SAGE top zone : masthead + Sergio ---------- */
/* drop/(100% - break) mantiene la pendiente original de 30vw/32% ≈ 0.94 */
:root{--sage-drop:22vw;--sage-gap:48px;--sage-break:76.5%}   /* depth/steepness of the angled break, clearance below content, where the break starts */
.top-sage{position:relative;background:none;padding-bottom:calc(var(--sage-drop) + var(--sage-gap));z-index:2}
.top-sage::before{content:"";position:absolute;inset:0;background:var(--sage);z-index:0;
  /* bottom edge: flat from left to the break point, then a steep diagonal down to the right corner */
  clip-path:polygon(0 0, 100% 0, 100% 100%, var(--sage-break) calc(100% - var(--sage-drop)), 0 calc(100% - var(--sage-drop)))}
.top-sage > *{position:relative;z-index:1}
.equipo-head{
  display:block;
  padding-top:clamp(120px,16vh,180px);padding-bottom:clamp(18px,2.4vh,30px);
}
.equipo-head .eyebrow2{
  display:inline-block;
  font-size:clamp(12px,1.05vw,15px);font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--ink)
}
.equipo-head::after{content:"";display:block;width:100%;height:1px;background:rgba(17,27,29,.32);margin-top:clamp(12px,1.8vh,20px)}

/* ---------- NIGHT zone : Fernando (page bg shows) ---------- */
/* pulled up under the sage break so Fernando sits close to the cut; the sage triangle overlaps on the right */
.zone-night{position:relative;background:transparent;color:var(--paper);z-index:1;
  margin-top:calc(var(--sage-gap) - var(--sage-drop));
  padding-top:clamp(40px,5vh,70px);padding-bottom:clamp(60px,9vh,120px)}

/* ---------- CREAM bottom zone : Rosario ---------- */
.bottom-cream{
  position:relative;background:none;color:var(--ink);
  margin-top:clamp(40px,6vh,90px);
  padding-top:clamp(80px,11vh,150px);padding-bottom:clamp(60px,9vh,120px);
}
.bottom-cream::before{content:"";position:absolute;inset:0;background:var(--cream);z-index:0;
  /* mirror of the sage break: flat top from the right, then a steep diagonal up to the left corner */
  clip-path:polygon(0 var(--sage-drop), calc(100% - var(--sage-break)) 0, 100% 0, 100% 100%, 0 100%)}
/* triángulo night dibujado SOBRE la foto: el corte de la foto queda definido por la MISMA diagonal de la sección */
.bottom-cream::after{content:"";position:absolute;inset:0;background:var(--night);z-index:2;pointer-events:none;
  clip-path:polygon(0 0, calc(100% - var(--sage-break)) 0, 0 var(--sage-drop))}
/* marcador invisible para el navbar: cubre el hueco oscuro sobre Rosario + la banda night del borde izq.
   (de ahí calc(margin gap + sage-drop)); mantiene el logo blanco hasta que el cream llega bajo él */
.bottom-cream .nav-dark-probe{position:absolute;left:0;top:calc(-1 * clamp(40px,6vh,90px));
  width:1px;height:calc(clamp(40px,6vh,90px) + var(--sage-drop));pointer-events:none;opacity:0}
.bottom-cream > *{position:relative;z-index:1}

/* ---------- member grid ---------- */
.member{position:relative}
.member-inner{
  display:grid;align-items:start;
  grid-template-columns:1.05fr 1.45fr 0.75fr;
  column-gap:clamp(34px,4.6vw,84px);row-gap:clamp(26px,3.2vw,58px);
  max-width:1460px;margin-inline:auto;
  padding-bottom:clamp(60px,9vh,120px);
}
/* Fernando : text column (bio + creds stacked) on the left, photo right */
.m-photo{order:1}.m-main{order:2}.m-cred{order:3}
/* Sergio: gap suficiente entre la foto y el texto para la flecha que cuelga (~74px) */
.top-sage .member-inner{column-gap:clamp(76px,5.4vw,90px)}
.zone-night .member-inner{grid-template-columns:1.3fr 0.8fr;grid-template-rows:auto auto;column-gap:clamp(30px,3.6vw,64px)}
.zone-night .m-main{grid-column:1;grid-row:1}
.zone-night .m-cred{position:relative;grid-column:1;grid-row:2;border-left:none;padding-left:0;padding-top:clamp(20px,2.8vh,30px);margin-top:clamp(14px,2vh,22px);border-top:none}
/* Fernando: la línea que separa la bio de los estudios se prolonga más allá del div, cruza el column-gap y toca la foto */
.zone-night .m-cred::before{content:"";position:absolute;top:0;left:0;width:calc(100% + clamp(30px,3.6vw,64px));height:1px;background:rgba(243,242,234,.22)}
/* Fernando: el texto de estudios/academia/foot ocupa ~70% del ancho en desktop (la línea sigue cruzando completa) */
.zone-night .cred-group,.zone-night .cred-foot{max-width:55%}
.zone-night .m-photo{grid-column:2;grid-row:1/3;align-self:stretch;aspect-ratio:auto;min-height:clamp(360px,52vh,560px)}

/* ---------- photo + diagonal chamfer cut ---------- */
/* width:100% + min-width:0 — sin ellos, aspect-ratio + align-self:stretch transfiere la altura
   de la fila al ancho de la foto y ésta desborda su columna tapando la bio (Sergio) */
.m-photo{position:relative;aspect-ratio:3/4;align-self:stretch;width:100%;min-width:0;will-change:transform;backface-visibility:hidden}
.m-photo .frame{position:absolute;inset:0;overflow:hidden}
.m-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:grayscale(1) contrast(1.05);
  backface-visibility:hidden}
/* foto color superpuesta al hacer hover — desactivada por ahora
   (reactivar: descomentar esto y el <img class="ph-color"> en memberHTML)
.m-photo .ph-color{position:absolute;inset:0;filter:none;opacity:0;transition:opacity .5s var(--ease)}
.m-photo:hover .ph-color{opacity:1}
*/
@media (prefers-reduced-motion:reduce){.m-photo{transform:none!important}}
/* cuts per person */
.cut-br .frame{clip-path:polygon(0 0, 100% 0, 100% 74%, 76% 100%, 0 100%)}
.cut-tl .frame{clip-path:polygon(24% 0, 100% 0, 100% 100%, 0 100%, 0 26%)}
.cut-bl .frame{clip-path:polygon(0 0, 100% 0, 100% 100%, 26% 100%, 0 74%)}
/* sage accent triangle filling Fernando's cut corner */
.m-photo .accent{position:absolute;top:0;left:0;width:46%;height:42%;background:var(--sage);
  clip-path:polygon(0 0, 100% 0, 0 100%);z-index:-1}
.m-num{position:absolute;top:13px;left:15px;font-size:11px;letter-spacing:.2em;font-weight:500;color:#fff;mix-blend-mode:difference;z-index:2}

/* ---------- name / role / bio ---------- */
.m-name-row{display:flex;align-items:center;gap:16px;margin-bottom:7px}
.m-name-row .arw{font-size:17px;color:var(--ink)}
.zone-night .m-name-row .arw{color:var(--paper)}
/* flechas: ícono SVG (reemplaza el dash CSS), conservando currentColor vía mask */
.arw{width:3.4em;height:3.4em;background:currentColor;
  -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12H18M18 12L13 7M18 12L13 17"/></svg>') center/contain no-repeat;
  mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12H18M18 12L13 7M18 12L13 17"/></svg>') center/contain no-repeat}
.arw::after{display:none}
/* Fernando, Sergio y Rosario: el texto del nombre arranca en el margen; solo la flecha cuelga a la izquierda */
.zone-night .m-name-row,
.top-sage .m-name-row,
.bottom-cream .m-name-row{margin-left:calc(-3.4 * 17px - 16px)}
.bottom-cream .m-name-row .arw{color:var(--ink)}
.m-name{font-weight:600;font-size:clamp(27px,2.7vw,42px);letter-spacing:.05em;line-height:1.0}
.top-sage .m-name{color:var(--ink)}      /* dark name on the sage zone (Sergio) */
.m-role{font-family:var(--f-serif);font-style:normal;font-size:clamp(17px,1.45vw,23px);
  line-height:1.15;margin:0 0 10px 46px;color:var(--ink-soft)}
.zone-night .m-role{color:var(--sage);margin-left:0}   /* Fernando: rol al mismo margen que "Estudios" */
.top-sage .m-role{margin-left:0}   /* Sergio: rol al mismo margen que el resto del bloque */

/* correo visible bajo el nombre/rol (antes iba último, en cred-foot) */
.m-mail{display:inline-block;font-size:clamp(12px,0.95vw,14px);font-weight:600;letter-spacing:.08em;
  color:var(--petrol-deep);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(28,79,93,.45);
  margin:0 0 clamp(20px,2.7vh,32px)}
.zone-night .m-mail{color:var(--sage-soft);text-decoration-color:rgba(144,173,171,.5)}

.m-bio{margin-left:46px;max-width:50ch}
.m-bio p{font-size:clamp(12.5px,1.0vw,15px);line-height:1.62;margin-bottom:12px;
  text-align:justify;text-justify:inter-word;hyphens:auto;color:rgba(17,27,29,.84)}
.zone-night .m-bio{margin-left:0;max-width:95%}   /* Fernando: bio al mismo margen que "Estudios", ancho casi completo con aire hacia la foto */
.top-sage .m-bio{margin-left:0}   /* Sergio: bio al mismo margen que el resto del bloque */
.zone-night .m-bio p{color:rgba(243,242,234,.92)}
.m-bio p:last-child{margin-bottom:0}

/* ---------- credentials ---------- */
.m-cred{padding-top:8px;border-left:1px solid rgba(35,94,110,.45);padding-left:clamp(20px,1.9vw,38px)}
/* Sergio (sage): an invisible clone of name+role pushes "Estudios" to start exactly where the bio starts */
/* la línea vertical sube hasta chocar y unirse con la horizontal de .equipo-head::after
   (compensa el padding-bottom del masthead + el padding-top:40px del slot-0) */
.top-sage .m-cred{margin-top:calc(-40px - clamp(18px,2.4vh,30px));padding-top:calc(40px + clamp(18px,2.4vh,30px))}
/* width:0 — el nombre nowrap del clon no debe empujar el ancho mínimo de la columna de creds */
.cred-spacer{visibility:hidden;display:flow-root;pointer-events:none;user-select:none;width:0}
.cred-spacer .m-name,.cred-spacer .m-role{white-space:nowrap}
.zone-night .m-cred{border-left-color:rgba(243,242,234,.22)}
.bottom-cream .m-cred{border-left:none;padding-left:0;border-top:1px solid rgba(35,94,110,.4);padding-top:clamp(18px,2.4vh,28px);margin-top:6px}
.cred-group{margin-bottom:clamp(16px,2.2vh,24px)}
.cred-group h4{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--petrol);margin-bottom:11px}
.zone-night .cred-group h4{color:var(--sage-soft)}
.cred-group ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.cred-group li{display:flex;align-items:flex-start;gap:11px;font-size:11.5px;line-height:1.46;color:rgba(17,27,29,.72);text-wrap:pretty}
.zone-night .cred-group li{color:rgba(243,242,234,.8)}
.cred-group li .arw{font-size:9px;width:2em;height:2em;margin-top:1px;color:var(--petrol);opacity:.9}
.zone-night .cred-group li .arw{color:var(--sage-soft)}

.cred-foot{margin-top:clamp(15px,2vh,22px);font-size:11.5px;letter-spacing:.02em;line-height:1.95;color:rgba(17,27,29,.74)}
.zone-night .cred-foot{color:rgba(243,242,234,.8)}
.cred-foot b{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--petrol)}
.zone-night .cred-foot b{color:var(--sage-soft)}
.cred-foot a{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(35,94,110,.5)}
.zone-night .cred-foot a{text-decoration-color:rgba(243,242,234,.45)}

/* Rosario: photo left (spanning), name+role+bio top-right, creds below bio */
.bottom-cream .member-inner{grid-template-columns:1.0fr 1.38fr;grid-template-rows:auto auto;column-gap:clamp(82px,6.8vw,112px);row-gap:clamp(28px,3.4vw,65px)}
.bottom-cream .m-photo{grid-column:1;grid-row:1/3;align-self:start;aspect-ratio:3/4;min-height:clamp(400px,58vh,620px);
  margin-top:clamp(-48px,-2.4vw,-24px)}   /* sube la foto para calzar bajo la diagonal (responsivo) */
.bottom-cream .m-photo img{object-fit:cover;object-position:center top}
/* el corte de la foto lo hace el triángulo oscuro superpuesto (.bottom-cream::after), no un clip-path en la foto */
.bottom-cream .m-main{grid-column:2;grid-row:1;padding-top:60px}
/* Rosario: nombre, rol y bio alineados al mismo margen que "Estudios" */
.bottom-cream .m-role{margin-left:0}
.bottom-cream .m-bio{margin-left:0}
.bottom-cream .m-cred{grid-column:2;grid-row:2;border-left:none;padding-left:0;border-top:none;
  padding-top:clamp(16px,2.2vh,24px);margin-top:clamp(8px,1.4vh,18px);position:relative}
.bottom-cream .m-cred::before{content:"";position:absolute;top:0;left:calc(-1 * clamp(28px,3.4vw,62px));width:calc(100% + clamp(28px,3.4vw,62px));height:1px;background:rgba(35,94,110,.42)}

/* entrance */
.member{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.page.ready .member{opacity:1;transform:none}
.page.ready .zone-night .member{transition-delay:.06s}
.page.ready .bottom-cream .member{transition-delay:.1s}
@media (prefers-reduced-motion:reduce){.member{opacity:1;transform:none;transition:none}}

/* ---------- responsive ---------- */
/* el riel vertical (.vrail) se oculta en ≤860px; sin él, el padding-right de .page solo
   deja ver el fondo oscuro del body (franja negra a la derecha) → se quita */
@media (max-width:860px){.page{padding-right:0}}
@media (max-width:1040px){
  :root{--cut:54px}
  .member-inner,.zone-night .member-inner,.bottom-cream .member-inner{grid-template-columns:0.95fr 1.15fr;gap:30px}
  .m-cred{grid-column:1/-1;border-left:none;padding-left:0;border-top:1px solid rgba(35,94,110,.4);padding-top:24px;margin-top:6px;
    display:grid;grid-template-columns:1fr 1fr;gap:22px 38px}
  .zone-night .m-cred{border-top-color:rgba(243,242,234,.22)}
  .zone-night .cred-group,.zone-night .cred-foot{max-width:none}   /* texto al 100% en tablet/mobile */
  .zone-night .m-cred::before,.bottom-cream .m-cred::before{display:none}
  .cred-foot{grid-column:1/-1}
  .zone-night .m-photo{order:2}.zone-night .m-main{order:1}.zone-night .m-cred{order:3}
  /* Sergio en tablet: sin stretch la foto conserva 3/4 (con stretch, el aspect-ratio
     transfería la altura de la fila al ancho y la foto tapaba la bio) */
  .m-photo{align-self:start}
  .top-sage .member-inner{column-gap:30px}
  /* sin espacio para la flecha colgante ni el clon de alineación de desktop */
  .zone-night .m-name-row,.top-sage .m-name-row,.bottom-cream .m-name-row{margin-left:0}
  .m-name-row .arw{display:none}
  .cred-spacer{display:none}
  .top-sage .m-cred{margin-top:6px;padding-top:24px}
}
@media (max-width:680px){
  :root{--cut:34px}
  .member-inner,.zone-night .member-inner,.bottom-cream .member-inner{grid-template-columns:1fr;gap:22px}
  .m-cred{grid-template-columns:1fr}
  .m-bio,.m-role{margin-left:0}
  .zone-night .m-photo,.m-photo{order:1}
  .zone-night .m-main,.m-main{order:2}
  .zone-night .m-cred,.m-cred{order:3}
  /* Safari iOS: con la foto sola en su fila, aspect-ratio + align-self:stretch + frame absoluto
     colapsa .m-photo a alto 0 (la foto no se ve). El alto lo da la propia <img> en flujo normal. */
  .m-photo{aspect-ratio:auto;max-height:none;align-self:auto}
  .m-photo .frame{position:relative;inset:auto}
  .m-photo img{display:block;height:auto;aspect-ratio:3/3.5;max-height:62vh}
  .zone-night .m-photo{min-height:0}
  /* reset de colocaciones de grid por-miembro (Fernando/Rosario) para que apilen en 1 columna */
  .zone-night .m-photo,.zone-night .m-main,.zone-night .m-cred,
  .bottom-cream .m-photo,.bottom-cream .m-main,.bottom-cream .m-cred{grid-column:auto;grid-row:auto}
  .bottom-cream .m-photo{margin-top:0;min-height:0}
  .bottom-cream .m-main{padding-top:0}
}
</style>
</head>

<script>
(function(){
  var page=document.getElementById('page');
  var ZONE=['','zone-night',''];        /* slot-1 is the dark zone */
  var CUT=['cut-br','',''];              /* photo chamfer per person (Rosario usa corte propio en CSS) */
  var ACCENT=[false,false,false];        /* sin triángulo sage */
  function L(){return document.documentElement.getAttribute('data-lang')==='en'?'en':'es';}

  function credHTML(m,lang){
    var h='';
    m['cred_'+lang].forEach(function(g){
      h+='<div class="cred-group"><h4>'+g.h+'</h4><ul>';
      g.items.forEach(function(it){h+='<li><span class="arw"></span><span>'+it+'</span></li>';});
      h+='</ul></div>';
    });
    var iL=lang==='en'?'Languages':'Idiomas';
    h+='<div class="cred-foot"><b>'+iL+'</b> / '+m['lang_'+lang]+'</div>';
    return h;
  }

  function memberHTML(m,i,lang){
    var accent=ACCENT[i]?'<span class="accent"></span>':'';
    /* invisible clone of name+role so the credentials column starts level with the bio (Sergio only) */
    var credSpacer=(i===0)?
      '<div class="cred-spacer" aria-hidden="true">'+
        '<div class="m-name-row"><span class="arw"></span><h2 class="m-name">'+m.name+'</h2></div>'+
        '<p class="m-role">'+m['role_'+lang]+'</p>'+
        '<span class="m-mail">'+m.email+'</span>'+
      '</div>':'';
    return ''+
      '<article class="member '+CUT[i]+'" data-screen-label="'+m.name+'">'+
        '<div class="member-inner">'+
          /* hover a color desactivado por ahora: para reactivarlo, añadir de nuevo
             <img class="ph-color" src="'+m.photo_color+'" alt="" aria-hidden="true"> junto a la img */
          '<div class="m-photo">'+accent+'<div class="frame"><img src="'+m.photo+'" alt="'+m.name+'"></div></div>'+
          '<div class="m-main">'+
            '<div class="m-name-row"><span class="arw"></span><h2 class="m-name">'+m.name+'</h2></div>'+
            '<p class="m-role">'+m['role_'+lang]+'</p>'+
            '<a class="m-mail" href="mailto:'+m.email+'">'+m.email+'</a>'+
            '<div class="m-bio">'+m['bio_'+lang].map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>'+
          '</div>'+
          '<aside class="m-cred">'+credSpacer+credHTML(m,lang)+'</aside>'+
        '</div>'+
      '</article>';
  }

  function render(){
    var lang=L();
    MEMBERS.forEach(function(m,i){
      var slot=document.getElementById('slot-'+i);
      if(slot)slot.innerHTML=memberHTML(m,i,lang);
    });
    /* marcador de zona oscura para el navbar sobre Rosario (slot-2 se reescribe en cada render) */
    var cream=document.getElementById('slot-2');
    if(cream){
      var p=document.createElement('span');
      p.className='nav-dark-probe';p.setAttribute('data-nav-dark','');p.setAttribute('aria-hidden','true');
      cream.appendChild(p);
    }
    requestAnimationFrame(function(){requestAnimationFrame(function(){page.classList.add('ready');});});
    setTimeout(function(){page.classList.add('ready');},250);
  }

  window.addEventListener('yla:lang',render);
  render();
})();

/* ---------- parallax: los bloques de foto se desplazan a otra velocidad que el scroll ---------- */
(function(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var blocks=[], ticking=false;
  function collect(){ blocks=[].slice.call(document.querySelectorAll('.m-photo')); }
  function update(){
    ticking=false;
    var vh=window.innerHeight||document.documentElement.clientHeight;
    for(var i=0;i<blocks.length;i++){
      var el=blocks[i], r=el.getBoundingClientRect();
      if(r.bottom<-80||r.top>vh+80) continue;
      /* p: 0 cuando el bloque entra por abajo, 1 cuando sale por arriba */
      var p=(vh-r.top)/(vh+r.height);
      if(p<0)p=0; else if(p>1)p=1;
      /* el bloque completo se desplaza ±65px respecto al scroll */
      var y=(0.5-p)*130;
      el.style.transform='translateY('+y.toFixed(1)+'px)';
    }
  }
  function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(update); } }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){ collect(); onScroll(); });
  window.addEventListener('yla:lang',function(){ requestAnimationFrame(function(){ collect(); update(); }); });
  collect(); update();
})();
</script>
